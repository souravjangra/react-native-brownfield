import groovy.json.JsonSlurper

def reactNativeVersion = null
def packageJsonFile = rootProject.file("../node_modules/react-native/package.json")

if (packageJsonFile.exists()) {
  def json = new JsonSlurper().parse(packageJsonFile)
  reactNativeVersion = json.version
} else {
  reactNativeVersion = "unknown"
}

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["RNBrownfield_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def isHermesEnabled() {
  return rootProject.hasProperty("hermesEnabled") && rootProject.getProperty("hermesEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RNBrownfield_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RNBrownfield_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
   if (supportsNamespace()) {
     namespace "com.callstack.reactnativebrownfield"

     sourceSets {
       main {
         manifest.srcFile "src/main/AndroidManifest.xml"
       }
     }
   }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    buildConfigField "boolean", "IS_HERMES_ENABLED", isHermesEnabled().toString()
    buildConfigField "String", "RN_VERSION", "\"$reactNativeVersion\""
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/newarch",
          // Codegen specs
          "generated/java",
          "generated/jni"
        ]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

// Ensure hot-updater is available at compile time through autolinking
// Both libraries are autolinked in the main app, so classes are available in the build context
afterEvaluate {
  def hotUpdaterProject = rootProject.findProject("hot-updater_react-native")
  if (hotUpdaterProject == null) {
    hotUpdaterProject = rootProject.findProject(":hot-updater_react-native")
  }
  if (hotUpdaterProject == null) {
    // Try to find any project with hot-updater in the name
    rootProject.allprojects.each { proj ->
      if (proj.name.contains("hot-updater") || proj.name.contains("HotUpdater")) {
        hotUpdaterProject = proj
      }
    }
  }
  
  if (hotUpdaterProject != null) {
    dependencies {
      implementation hotUpdaterProject
    }
  } else {
    println "Warning: hot-updater project not found, HotUpdater functionality may not work"
  }
}
